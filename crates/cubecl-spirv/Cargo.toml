[package]
authors = ["Genna Wingert"]
categories = ["algorithms"]
description = "SPIR-V compiler for CubeCL"
edition.workspace = true
keywords = ["gpu", "compiler"]
license.workspace = true
name = "cubecl-spirv"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-spirv"
version.workspace = true


[lints]
workspace = true


[features]
default = [
    "std",
    "debug-info",
    "cubecl-common/default",
    "cubecl-core/default",
    "cubecl-runtime/default",
]
# Source locations in kernels that have debug data: core `OpLine`, or
# `NonSemantic.Shader.DebugInfo.100` with inlined frames. Without it, kernels get
# no debug data. The cost is small: the `dev` unit-test binary of this crate
# grows from 38.60 MB to 38.74 MB of text (+0.4%), with the same tests.
debug-info = []
pliron-dump = ["std"]
std = [
    "cubecl-common/std",
    "cubecl-core/std",
    "cubecl-runtime/std",
    "pliron/std",
]

tracing = [
    "cubecl-runtime/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
    "cubecl-opt/tracing",
]

[dependencies]
bitflags = { workspace = true }
cubecl-common = { path = "../cubecl-common", version = "=0.11.0-pre.4", default-features = false }
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.4" }
cubecl-environment = { path = "../cubecl-environment", version = "=0.11.0-pre.4", default-features = false }
cubecl-ir = { path = "../cubecl-ir", version = "=0.11.0-pre.4", default-features = false, features = [
    "spirv",
] }
cubecl-runtime = { path = "../cubecl-runtime", version = "=0.11.0-pre.4", default-features = false, features = [
    "channel-mutex",
] }
half = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
paste = { workspace = true }
pliron = { workspace = true }
serde = { workspace = true }

hashbrown = { workspace = true }

pliron-spirv = { workspace = true }
rspirv = { workspace = true, features = ["serialize", "deserialize"] }

# Optimizer
cubecl-opt = { path = "../cubecl-opt", version = "=0.11.0-pre.4" }
